# Kafka for the Kafka-to-ClickHouse experiments (docs/kafka-to-clickhouse.md):
# Strimzi's operator (upstream chart, local values) plus manifests/ holding
# the one cluster it runs. KRaft, a single node that is both controller and
# broker, pinned to louise next to ClickHouse, log on Longhorn (sequential
# writes, and the data is the point), reachable on 9092 in-cluster and from
# a laptop over the WARP private route (README, "Private network"). Kafbat
# UI, a browser onto it, is its own app (apps/kafbat). No auth: the private
# route is the wall, as for Prefect and ClickHouse.
# Three brokers and three controllers wait for the third node, like etcd
# and Keeper: a Raft quorum on two machines protects nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd-homelab
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: "1.2.0"
      helm:
        valueFiles:
          - $values/apps/kafka/values.yaml
    - repoURL: git@github.com:angloyna/homelab-gitops.git
      targetRevision: HEAD
      path: apps/kafka/manifests
    - repoURL: git@github.com:angloyna/homelab-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Strimzi 1.2.0's Kafka CRD declares status.clusterSecurity with an empty
  # `properties: {}`; the API server drops the empty map on admission, so
  # the live CRD never matches the chart and the app sat OutOfSync with
  # self-heal re-applying it forever. Ignore that one pointer.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties
