apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flow-secrets
  namespace: argocd
  annotations:
    # Wave -1: after external-secrets (-2) provides the CRDs and the SDK
    # server, and before flow-migrations (0), whose Flyway Job reads
    # DB_PASSWORD out of the Secret this app creates. ArgoCD waits for each
    # wave to go Healthy, and it ships a health check for ExternalSecret, so
    # wave 0 does not start until the sync has actually succeeded.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: git@github.com:angloyna/homelab-gitops.git
    targetRevision: HEAD
    path: apps/flow-secrets/chart
    helm:
      valueFiles:
        - ../values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: flow-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
