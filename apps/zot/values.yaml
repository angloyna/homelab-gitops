service:
  type: ClusterIP
  port: 5000

# Deliberately unpinned. zot must be able to move: flow uses
# imagePullPolicy: Always against zot's ClusterIP, so pinning the registry to
# the same node as everything else means a node reboot leaves every flow pod
# in ImagePullBackOff. The PVC is Longhorn with a replica on each node, so
# rescheduling re-attaches cleanly.

persistence: true
pvc:
  create: true
  accessModes: ["ReadWriteOnce"]
  storage: 20Gi

mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true, "cve": { "updateInterval": "24h" } },
        "ui": { "enable": true }
      }
    }
