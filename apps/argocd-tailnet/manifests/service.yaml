# ArgoCD's UI and API on the tailnet, as https://argocd.spikeelectric.dev.
#
# ArgoCD itself is the hand-installed `argocd` Helm release (argo-cd chart,
# `helm -n argocd get values argocd`), not an app here, and its
# argocd-server serves TLS with
# its own self-signed certificate: a plain-HTTP request to it gets a 301
# to https, which behind a TLS-terminating proxy is a redirect loop. So
# Traefik re-encrypts: it terminates the real certificate (Ingress below)
# and speaks HTTPS to the pod, told to by the two annotations on this
# Service. Traefik reads those annotations from the SERVICE, and the
# release's own Service is not ours to edit, hence a second Service over
# the same pods -- the same shape as traefik-tailnet.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-tailnet
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    # <namespace>-<name>@kubernetescrd, the ServersTransport beside this file.
    traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-server-selfsigned@kubernetescrd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/instance: argocd
  ports:
    - name: https
      port: 443
      targetPort: 8080
