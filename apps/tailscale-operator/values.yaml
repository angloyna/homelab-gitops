# Tailscale Kubernetes operator. Stock apart from what is spelled out here.
#
# No oauth block: the chart then mounts the Secret `operator-oauth` (keys
# client_id, client_secret) from this namespace, which apps/tailscale-oauth
# syncs from Bitwarden. The client is tagged tag:k8s-operator, matching
# operatorConfig.defaultTags below, and the policy lets tag:k8s-operator
# own tag:k8s, which the proxies get; both are defined in
# flow-infrastructure (shared/tailnet-policy.hujson, modules/tailscale).

operatorConfig:
  hostname: tailscale-operator
  defaultTags:
    - "tag:k8s-operator"

proxyConfig:
  # The devices the operator creates for Services and Ingresses carry this
  # tag; the ACL grant for cluster services is written against it.
  defaultTags: "tag:k8s"

# The operator can also expose the Kubernetes API server on the tailnet
# and let tailnet identity map to RBAC. Not wanted: kubectl access stays
# on the LAN with the kubeconfig.
apiServerProxyConfig:
  mode: "false"

# We expose Services (apps/traefik-tailnet), not Ingresses: a tailscale-class
# Ingress terminates TLS with a *.ts.net certificate, and the names we want
# are under spikeelectric.dev, whose certificates Traefik holds. The class
# stays registered because it costs nothing and may be useful for a one-off.
ingressClass:
  enabled: true
