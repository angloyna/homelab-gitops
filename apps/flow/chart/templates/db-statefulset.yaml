apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-db
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-db
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-db
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db
          image: {{ .Values.db.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # DB__USER comes from the ConfigMap, not the Secret -- the Bitwarden
            # project holds DB__PASSWORD but not DB__USER (it is not a credential).
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB__USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DB__PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          # Probe exec commands don't go through a shell, so k8s's $(VAR)
          # substitution (which only applies to container command/args, not
          # probes) never kicks in here -- pg_isready got called with a
          # literal/empty -U value and fell through to the OS user ("root").
          # Route through sh -c so normal env-var expansion applies instead.
          #
          # startupProbe gives crash recovery / WAL replay room to finish
          # (up to 5min) before liveness probing even begins -- without it,
          # the tight liveness window below was killing postgres mid-recovery
          # (exit 137) and forcing it to restart recovery from scratch,
          # i.e. a self-inflicted crash loop.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
