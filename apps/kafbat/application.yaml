# Kafbat UI (the maintained fork of provectus kafka-ui): a browser onto the
# Kafka cluster in apps/kafka -- topics, messages, consumer groups and their
# lag. Its own Application and namespace so it syncs, prunes and gets
# upgraded independently of the broker; it only needs the in-cluster
# bootstrap address, which it reads from values.yaml. Reached over the WARP
# private route at the chart's own ClusterIP Service (README, "Private
# network"). No login: the private route is the wall, as for Kafka itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafbat
  namespace: argocd-homelab
  # No wave: it does not need kafka to exist first; it just shows the
  # cluster as offline until it does.
spec:
  project: default
  sources:
    - repoURL: https://ui.charts.kafbat.io/
      chart: kafka-ui
      targetRevision: "1.6.5"
      helm:
        valueFiles:
          - $values/apps/kafbat/values.yaml
    - repoURL: git@github.com:angloyna/homelab-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kafbat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
