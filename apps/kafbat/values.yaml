# kafka-ui chart: one cluster, `main`, by its in-cluster bootstrap in the
# kafka namespace. Rendered with release name "kafbat", so the chart names
# its objects kafbat-kafka-ui. The chart's Service cannot carry a
# loadBalancerClass, so it stays ClusterIP and manifests/tailnet-service.yaml
# is the door.
#
# The UI can produce messages and create or edit topics as well as read.
# The topics git owns (KafkaTopic resources in apps/kafka) are put back by
# the topic operator if changed here, so treat it as a window, not a
# control panel.

yamlApplicationConfig:
  kafka:
    clusters:
      - name: main
        bootstrapServers: main-kafka-bootstrap.kafka.svc.cluster.local:9092
  auth:
    type: disabled
  management:
    health:
      ldap:
        enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
