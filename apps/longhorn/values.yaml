# Matches the values already applied to the live "longhorn" Helm release
# (first installed as chart 1.12.0, namespace longhorn-system), plus a fix for new volumes:
# this is a 2-node cluster, so the default 3-replica ask can never fully
# schedule and leaves every volume permanently "degraded".
defaultSettings:
  defaultReplicaCount: 2
  # tina's disk is 250G and every volume keeps a replica there, so its
  # scheduling budget (disk minus the 30% OS reserve, times this
  # percentage) filled up at ~172G committed while only ~47G was actually
  # written; the next volume (prefect-db, 2026-10-07) came up degraded with
  # its second replica unschedulable. Volumes are thin, so let Longhorn
  # commit twice the budget; storage-minimal-available-percentage (25%)
  # still stops scheduling when the disk itself runs low.
  storageOverProvisioningPercentage: 200
  # After a Longhorn upgrade the volumes keep running the old engine until
  # each is upgraded; with this at 0 (the default) that never happens on
  # its own. 1 lets Longhorn live-upgrade one volume per node at a time,
  # which v1 volumes support while attached, so the data path follows the
  # control plane without anyone clicking through the UI.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

# The longhorn StorageClass bakes numberOfReplicas into its parameters,
# which take precedence over defaultSettings.defaultReplicaCount for new
# PVCs. StorageClass parameters are immutable once created, so applying
# this requires recreating the StorageClass - not done automatically.
persistence:
  defaultClassReplicaCount: 2
