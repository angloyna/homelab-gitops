# The secret GitHub signs webhook deliveries with, merged into ArgoCD's own
# argocd-secret under the key ArgoCD reads it from. flow-infrastructure's
# environments/dev generates the value and writes it to the flow-dev
# Bitwarden project; the same value is pasted into each repository's
# webhook (flow-infrastructure README, "ArgoCD webhook").
#
# Merge, not Owner: argocd-secret belongs to the hand-installed argocd Helm
# release (admin password, server key, TLS). This adds one key to it and,
# if this object is ever deleted, removes only that key. ArgoCD watches the
# Secret, so the value is live without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: flow-dev
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: ARGOCD__WEBHOOK_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
