service:
  type: ClusterIP
  port: 5000

# Deliberately unpinned. zot must be able to move: flow uses
# imagePullPolicy: Always against zot's ClusterIP, so pinning the registry to
# the same node as everything else means a node reboot leaves every flow pod
# in ImagePullBackOff. The PVC is Longhorn with a replica on each node, so
# rescheduling re-attaches cleanly.

persistence: true
pvc:
  create: true
  accessModes: ["ReadWriteOnce"]
  storage: 20Gi

# The sync block makes zot a pull-through cache for Docker Hub: a request for
# an image zot does not hold is fetched from Docker Hub once, stored on the
# volume, and served locally from then on. The CI runners' dockerd points at
# it with --registry-mirror (apps/arc-runners), so the postgis and flyway
# images the integration shards pull cost one Docker Hub pull per tag, not one
# per job. On-demand only, never polled: Docker Hub rate-limits pulls and has
# no catalog, and the zot docs say so explicitly. Cached images are plain
# repositories here (`library/postgres`, `flyway/flyway`) beside flow's own.
mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true, "cve": { "updateInterval": "24h" } },
        "ui": { "enable": true },
        "sync": {
          "enable": true,
          "registries": [
            {
              "urls": ["https://docker.io"],
              "onDemand": true,
              "tlsVerify": true,
              "content": [{ "prefix": "**", "destination": "/", "stripPrefix": false }]
            }
          ]
        }
      }
    }
