apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-tailnet
  namespace: argocd
  annotations:
    # After tailscale-operator (-1): a Service with loadBalancerClass
    # tailscale sits Pending until the operator exists to claim it.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:angloyna/homelab-gitops.git
    targetRevision: HEAD
    path: apps/traefik-tailnet/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
