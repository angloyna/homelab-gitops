# The Tailscale Kubernetes operator: puts cluster services on the tailnet.
# Today that is one thing, the Traefik ingress controller (apps/traefik-tailnet),
# so names like grafana.spikeelectric.dev can resolve to a tailnet address
# and be reachable only from it. See README, "Tailscale".
#
# The one credential, the OAuth client the operator logs in with, arrives
# as the Secret `operator-oauth` from Bitwarden (apps/tailscale-oauth);
# OpenTofu in flow-infrastructure creates the client and writes it there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    # After tailscale-oauth (1), which needs the flow app (0) for its secret
    # store: without the Secret the operator pod never starts, and a wave
    # that never goes Healthy would hold up everything after it. The cost
    # is that on a fresh cluster the tailnet side waits for Flow's chain.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: "1.102.4"
      helm:
        valueFiles:
          - $values/apps/tailscale-operator/values.yaml
    - repoURL: git@github.com:angloyna/homelab-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ProxyClass and ProxyGroup CRDs embed pod-template schemas, the
      # same shape that put the ESO and ARC CRDs past the client-side-apply
      # annotation ceiling. Server-side from the start rather than finding
      # out.
      - ServerSideApply=true
