# Self-hosted GitHub Actions runners for spike-electric/flow.
#
# One ephemeral Pod per queued job, destroyed when the job ends -- nothing
# persists between jobs. Replaces GitHub-hosted `ubuntu-latest` for the jobs
# in that repo's .github/workflows/ci-checks.yml.

githubConfigUrl: "https://github.com/spike-electric/flow"

# Repo-scoped, not org-scoped: only this repo's workflows can schedule work
# onto the cluster. Widening it to the org would let any repo there run
# privileged containers here.
#
# Named here, created by hand -- this Secret is the one credential in the
# cluster that comes from neither git nor Bitwarden. Nothing in this repo
# manages it, which also means ArgoCD's `prune` cannot delete it, and a
# rotation is a kubectl command rather than a commit. See README.
githubConfigSecret: github-pat

# Stated explicitly rather than left to the chart's label-based discovery of
# the controller, which is a live-cluster lookup and also makes the chart
# unrenderable by `helm template`. The name is release-derived: ArgoCD sets the
# Helm release name from the Application name, so apps/arc-controller yields
# `arc-controller-gha-rs-controller`. Renaming that Application breaks this.
controllerServiceAccount:
  name: arc-controller-gha-rs-controller
  namespace: arc-systems

# What `runs-on:` must say in ci-checks.yml. Runner scale sets match on this
# name ONLY -- they do not register the legacy `self-hosted` label, so a job
# asking for `self-hosted` queues forever with no error anywhere.
runnerScaleSetName: "flow-k8s"

# Warm runners, so a job does not wait on a pod cold start (image pull, dind
# startup probe -- 30-90s, and minutes the first time a node pulls the runner
# image).
#
# Two rather than one because runners are ephemeral: a pod takes exactly one
# job and is then destroyed, so with a single warm runner every job after the
# first lands in the gap while its replacement is still starting.
minRunners: 2
# ci-checks.yml fans out to 10 parallel jobs (six singles plus the four-shard
# integration matrix); 12 leaves a little headroom. Each runner is two
# containers on a two-node cluster -- raising this much further will contend
# with flow itself for node capacity.
maxRunners: 12

# Docker-in-Docker, spelled out rather than requested with
# `containerMode.type: dind`. The two are the same pod: this is the chart's
# own dind rendering for Kubernetes >= 1.29 (`helm template` it with
# containerMode set and diff), copied here because the chart injects its dind
# sidecar verbatim and drops any `dind` container declared in values -- so
# there is no other way to pass dockerd a flag. GitHub's docs prescribe
# exactly this: unset containerMode, copy the spec, edit.
#
# The flag is `--registry-mirror`: dockerd asks zot for every Docker Hub image
# first and falls back to Docker Hub when zot is unreachable. zot's on-demand
# sync (apps/zot) fetches a miss from Docker Hub once and serves every later
# pull from the Longhorn volume, so the postgis and flyway images the
# integration shards pull are a LAN hop after the first job. Addressed by DNS,
# unlike flow's zot references: dockerd runs in the pod's network namespace,
# where CoreDNS resolves, and the name survives a Service recreation.
#
# Kubernetes mode would avoid dind but supports neither the `services:`
# postgis container nor the `docker run` of flyway that ci-checks.yml uses.
#
# Two consequences worth knowing before editing that workflow:
#   - runner and dind share a network namespace, which is why the service
#     container answers on localhost:5432 and why flyway's --network host
#     reaches the same Postgres.
#   - bind mounts are resolved by dockerd inside the dind sidecar, not by the
#     runner. That normally breaks silently; it works here only because the
#     `work` volume is mounted at /home/runner/_work in BOTH containers, so
#     ${{ github.workspace }} means the same path in each.
#
# The runner image appears twice (runner container, init-dind-externals);
# bump both together. Pinned deliberately: Kubernetes defaults
# imagePullPolicy to Always for the `latest` tag, so `:latest` meant a
# registry round-trip before every runner pod started -- and a silent runner
# upgrade whenever GitHub republished the tag. A version tag makes warm nodes
# skip the registry and turns upgrades into a commit.
template:
  spec:
    # Arch, not hostname -- this is not the node pinning the README warns
    # about. The postgis and flyway images and the setup-beam toolchain
    # downloads are amd64, so an arm64 node joining later must not start
    # silently picking up jobs it cannot run.
    nodeSelector:
      kubernetes.io/arch: amd64
    initContainers:
      # The tool cache is a hostPath so the toolchains setup-python,
      # setup-node and setup-beam install survive the pod: a runner that finds
      # Python 3.12 or OTP 27 already in the cache skips the download and
      # install entirely, which the README names as the main reason a job is
      # slower here than on ubuntu-latest. One cache per node, filled by the
      # first job on that node to ask for a version, so a bump in a workflow's
      # python-version needs no change here. Runner steps see it through
      # AGENT_TOOLSDIRECTORY below; the chown is needed because kubelet
      # creates a hostPath root-owned and the runner is uid 1001.
      #
      # It is the one thing that now persists between jobs. The actions write
      # a version with a `.complete` marker and only trust a marked
      # directory, so a job killed mid-install leaves nothing a later job
      # will use. Two jobs installing the same uncached version on one node
      # at the same moment can still trip over each other; that is a one-time
      # rerun on the first run after enabling or after a version bump.
      - name: init-toolcache-perms
        image: docker:dind
        command: ["chown", "1001:1001", "/opt/hostedtoolcache"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: toolcache
            mountPath: /opt/hostedtoolcache
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --registry-mirror=http://zot.zot.svc.cluster.local:5000
          - --insecure-registry=zot.zot.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          - name: AGENT_TOOLSDIRECTORY
            value: /opt/hostedtoolcache
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        # The deploy workflows (deploy, deploy-logging, restart-services,
        # backup) reach the prod Mac over Tailscale: tailscale/github-action
        # runs `sudo tailscaled` in this container, which needs NET_ADMIN to
        # create its interface and the host's /dev/net/tun to back it.
        # Without both, `tailscale up` hangs until the action's retries run
        # out. The runner itself stays uid 1001; only the sudo'd daemon
        # picks the capability up.
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: toolcache
            mountPath: /opt/hostedtoolcache
          - name: dev-net-tun
            mountPath: /dev/net/tun
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        emptyDir: {}
      - name: toolcache
        hostPath:
          path: /var/lib/gha-toolcache
          type: DirectoryOrCreate
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
