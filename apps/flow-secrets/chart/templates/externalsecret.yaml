# Produces the Secret that apps/flow and apps/flow-migrations already consume
# by name. Neither chart changes: `existingSecret: flow-dev-secrets` keeps
# working, it is just no longer created by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.targetSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Release.Name }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.targetSecretName }}
    # Owner: ESO creates the Secret and deletes it if this ExternalSecret goes
    # away. Safe here because nothing else writes to flow-dev-secrets any more
    # -- but it does mean deleting this app removes the Secret out from under
    # a running flow.
    creationPolicy: Owner
  data:
    {{- range .Values.secretKeys }}
    # remoteRef.key is a secret NAME, not a UUID. ESO resolves it within the
    # store's project and errors if it matches zero or more than one secret.
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
