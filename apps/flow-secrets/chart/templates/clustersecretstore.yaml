{{- if not .Values.organizationID }}
{{- fail "organizationID is required -- set it in apps/flow-secrets/values.yaml" }}
{{- end }}
{{- if not .Values.projectID }}
{{- fail "projectID is required -- set it in apps/flow-secrets/values.yaml" }}
{{- end }}
# Cluster-scoped on purpose: a namespaced SecretStore ignores the `namespace:`
# field on auth.secretRef and caProvider, which would force both the access
# token and a copy of the CA into flow-dev.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "flow-secrets.labels" . | nindent 4 }}
  annotations:
    # ESO's CRDs arrive in wave -2; without this the first sync of a fresh
    # cluster fails dry-run on an unknown kind.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    # All lowercase -- the CRD field is `bitwardensecretsmanager`, not the
    # camelCase spelling shown on the API reference page.
    bitwardensecretsmanager:
      # One store == one organization/project pair. Pointing flow-dev at a
      # different Bitwarden project means changing projectID here, not adding
      # a second store.
      organizationID: {{ .Values.organizationID | quote }}
      projectID: {{ .Values.projectID | quote }}
      # apiURL/identityURL omitted -> Bitwarden cloud, matching the compose
      # deploy path (use_bitwarden.sh passes no --server-url either).
      bitwardenServerSDKURL: {{ .Values.sdkServer.url | quote }}
      caProvider:
        type: Secret
        name: {{ .Values.sdkServer.caSecretName | quote }}
        key: {{ .Values.sdkServer.caSecretKey | quote }}
        namespace: {{ .Values.sdkServer.caNamespace | quote }}
      auth:
        secretRef:
          credentials:
            name: {{ .Values.accessToken.secretName | quote }}
            key: {{ .Values.accessToken.key | quote }}
            namespace: {{ .Values.accessToken.namespace | quote }}
