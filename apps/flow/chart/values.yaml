image:
  # Zot's ClusterIP, not its .svc.cluster.local DNS name -- kubelet/containerd
  # pull images from the node's own network namespace using the node's own
  # resolver (systemd-resolved etc), not CoreDNS, so *.svc.cluster.local
  # names never resolve for image pulls (only inside pods, via the per-pod
  # resolv.conf kubelet injects). ClusterIPs route via kube-proxy's iptables
  # rules, which apply host-wide, so this works without depending on DNS.
  # Update this if zot's Service is ever deleted/recreated (new ClusterIP).
  registry: 10.43.114.154:5000
  tag: dev
  # Always, not IfNotPresent: this "dev" tag gets reused/overwritten on every
  # local rebuild+push, and IfNotPresent means a node with anything already
  # cached under that tag never re-pulls -- silently running stale (possibly
  # wrong-architecture) images. Always guarantees the node checks the
  # registry for a new digest every time a pod starts.
  pullPolicy: Always

hostname: flow-dev.turdblossom.dev

# Name of a Secret holding the real credentials -- DB_PASSWORD,
# SECRET_KEY_BASE, integration API keys. No longer created by hand: the
# flow-secrets app (sync wave -1) has External Secrets Operator build it from
# the Bitwarden Secrets Manager project. This chart still just consumes it by
# name, so nothing here had to change.
#
# DB_USER is deliberately NOT in it any more -- it is config, not a
# credential, and now comes from the ConfigMap. See README.md.
existingSecret: flow-dev-secrets

replicaCount: 1

# e.g. {kubernetes.io/hostname: some-node} to pin all pods to one node.
nodeSelector: {}

db:
  image: postgis/postgis:18-3.6
  name: flow_data
  # Not a secret, so it does NOT come from Bitwarden -- it is absent from
  # scripts/required-secrets.txt and lives in the committed .env.production /
  # .env.staging on the compose hosts. It used to ride along in the
  # hand-made flow-dev-secrets; now it comes from the ConfigMap instead.
  user: flow_user
  storage: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

attachments:
  storage: 10Gi

api:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

apiPublic:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

realtime:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Non-secret config -- rendered into a ConfigMap and consumed via envFrom.
config:
  # These three used to live in the hand-made flow-dev-secrets even though
  # none is a credential. The Bitwarden project only holds the 15 names in
  # scripts/required-secrets.txt, so once ESO owns the Secret they would
  # simply vanish -- they belong here instead.
  #
  # NOTE: both webhook URLs currently point at scorpio.dev, the staging
  # COMPOSE host, not at this cluster's flow-dev.turdblossom.dev. Preserved
  # verbatim from the live Secret so this change alters nothing at runtime;
  # retarget deliberately if that is not what you want.
  bcWebhookUrl: "https://scorpio.dev"
  linearWebhookUrl: "https://scorpio.dev"
  bcDeepLinkBase: "https://businesscentral.dynamics.com/?company=Spike%20Electric%20Controls"

  appTimezone: "America/Chicago"
  maxUploadBytes: "104857600"
  disableScheduler: "false"
  devSkipLogin: "true"
  maxScanInputLength: "100"
  scanWorkerConcurrency: "10"
  bcExportDir: "/tmp/bc_exports"
  bcEnvironment: "Sandbox"
  paylocityBaseUrl: "https://dc1prodgwext.paylocity.com"
  paylocityEmployeeSyncSource: "paylocity"
  paylocityPunchAnomalyHours: "24"
  paylocityPunchCapHours: "12"
  paylocityPunchSyncDays: "14"
