# prefect-server: API + UI, scheduling and the other background services in
# the one pod (runAsSeparateDeployment stays off; nothing here needs the
# split). Database is the Postgres in manifests/, reached through the
# hand-created `prefect-db` Secret's connection string (README, "Prefect").
#
# Reachability is the chart's own ClusterIP Service over the WARP private
# route (README, "Private network") -- no DNS record, no certificate, no
# Traefik. So the chart's ingress stays off.

postgresql:
  enabled: false

externalDatabase:
  existingSecret: prefect-db
  connectionStringSecretKey: connection-string

server:
  # No login: the UI is reachable only over the private route. Flip this on (and
  # the matching block in worker-values.yaml) if that ever changes.
  basicAuth:
    enabled: false
  # The browser calls the API at this URL, so it must be the address the
  # browser uses, which over the private route is the Service's cluster
  # DNS name (the same one the worker uses).
  uiConfig:
    prefectUiApiUrl: http://prefect-server.prefect.svc.cluster.local:4200/api
  # The server never talks to the Kubernetes API.
  automountServiceAccountToken: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

ingress:
  enabled: false
