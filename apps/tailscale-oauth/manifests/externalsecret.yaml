# Keys as the operator chart expects them (client_id, client_secret), values
# from the flow-dev Bitwarden project, where flow-infrastructure's
# environments/dev writes them from the OAuth client shared/ creates.
# Rotating the client is `tofu apply` there; this re-reads within the hour,
# and the operator picks the new mount up on its next restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: flow-dev
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE__OPERATOR_OAUTH_CLIENT_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE__OPERATOR_OAUTH_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
